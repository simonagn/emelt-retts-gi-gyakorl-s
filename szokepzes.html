<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Formation Practice – Emelt</title>
<style>
  :root { --ok:#1e8e3e; --bad:#d93025; --accent:#1a5fb4; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
         margin: 0; padding: 16px; color: #222; line-height: 1.9; }
  .wrap { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px 24px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 4px; line-height: 1.3; }
  .sub { color: #666; margin: 0 0 16px; font-size: .95rem; line-height: 1.4; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  select, input[type=text].name { font-size: 1rem; padding: 6px 10px; border: 1px solid #bbb; border-radius: 8px; }
  h2 { font-size: 1.15rem; margin: 10px 0 6px; }
  .text { font-size: 1.05rem; }
  .gap { white-space: nowrap; }
  .gap input { font-size: 1rem; width: 9.5em; padding: 1px 6px; border: none; border-bottom: 2px solid #888;
               background: #f3f6fb; border-radius: 4px 4px 0 0; }
  .gap input:focus { outline: none; border-bottom-color: var(--accent); background: #e8f0fe; }
  .gap .num { font-size: .75rem; font-weight: 700; color: var(--accent); vertical-align: super; margin-right: 1px; }
  .gap .base { font-size: .8rem; font-weight: 700; letter-spacing: .03em; color: #555; margin-left: 3px; }
  .gap.example input { border-bottom-color: #aaa; color: #555; font-style: italic; }
  .gap.ok input { border-bottom-color: var(--ok); background: #e6f4ea; }
  .gap.bad input { border-bottom-color: var(--bad); background: #fce8e6; }
  .fix { color: var(--ok); font-weight: 600; font-size: .9rem; margin-left: 3px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button { font-size: 1rem; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .result { margin-top: 14px; font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
  .status { font-size: .9rem; color: #666; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Word Formation – Advanced Level Practice</h1>
  <p class="sub">Read the text. Use the word in CAPITALS to form a word that fits the gap. There is an example (0) at the beginning.</p>

  <div class="row">
    <input type="text" class="name" id="studentName" placeholder="Your name">
    <select id="taskSelect"></select>
  </div>

  <h2 id="title"></h2>
  <div class="text" id="text"></div>

  <div class="buttons">
    <button id="checkBtn">Check</button>
    <button id="showBtn" class="secondary">Show answers</button>
    <button id="resetBtn" class="secondary">Try again</button>
  </div>
  <div class="result" id="result"></div>
  <div class="status" id="status"></div>
</div>

<script>
/* =====================================================================
   BEÁLLÍTÁSOK
   SHEET_URL: ide másold a Google Apps Script webapp URL-jét
   (ugyanaz lehet, mint a wordtests-nél). Ha üres, nem küld eredményt.
   ===================================================================== */
const SHEET_URL = "";

/* =====================================================================
   FELADATOK
   Jelölés a szövegben:  [ALAPSZÓ:helyes válasz]
   Több elfogadható válasz:  [ALAPSZÓ:válasz1/válasz2]
   Az első [..] a 0. példa (kitöltve jelenik meg, nem számít bele a pontba).
   ===================================================================== */
const TASKS = [
  {
    title: "Working from home",
    text: `Over the past few years, remote work has changed the daily lives of millions of [EMPLOY:employees]. For many people, the biggest advantage is [FLEXIBLE:flexibility]: they can organise their own day and no longer have to spend hours stuck in [PREDICT:unpredictable] traffic. However, working alone at the kitchen table can also lead to feelings of [LONELY:loneliness], especially for younger workers who live by themselves.

Some managers remain [CONVINCE:unconvinced] that staff are truly productive at home, yet several studies suggest that output has [SIGNIFY:significantly] improved in many sectors. [SUCCEED:Successful] remote teams usually rely on clear communication, and regular video calls help to maintain good working [RELATE:relationships]. Without a [DEPEND:dependable] internet connection, though, even the best plans fall apart.

Today, many companies offer a [COMBINE:combination] of office and home working, and most experts agree that this arrangement is [LIKE:unlikely] to disappear any time soon.`
  },
  {
    title: "The true cost of fast fashion",
    text: `The clothing industry is one of the world's biggest [POLLUTE:polluters]. Cheap, trendy clothes have become [INCREASE:increasingly] popular, but their [PRODUCE:production] requires huge amounts of water and energy. In some countries, factory workers spend long hours in [SAFE:unsafe] conditions for very low wages.

Many shoppers are simply [AWARE:unaware] of these problems, as the real story behind a five-euro T-shirt is rarely told. Campaigners argue that consumers should take [RESPONSIBLE:responsibility] for what they buy, and they point out that second-hand shops offer an [ATTRACT:attractive] alternative to buying new.

Several well-known brands have recently made a [COMMIT:commitment] to using recycled materials, but critics claim that some of these promises are [LEAD:misleading]. Real change will require a [WILLING:willingness] to buy fewer, better-quality items. [FORTUNATE:Fortunately], attitudes among young people seem to be slowly changing.`
  },
  {
    title: "Growing up online",
    text: `Social media has become an [AVOID:unavoidable] part of teenage life. Most young people check their phones [CONSTANT:constantly], often without even noticing. Psychologists warn that comparing yourself to others online can increase [ANXIOUS:anxiety] and damage [CONFIDENT:confidence/self-confidence]. Photos on these platforms are frequently edited, so they give a completely [REAL:unrealistic] picture of other people's lives.

On the other hand, social networks allow teenagers to stay in touch with friends and to find [SUPPORT:supportive] communities of people with similar interests. Many parents feel [HELP:helpless] when they try to control their children's screen time.

Experts recommend open [DISCUSS:discussion/discussions] rather than strict [RESTRICT:restrictions], which tend to make teenagers more [SECRET:secretive]. After all, learning to use technology [RESPONSIBLE:responsibly] is an essential skill in the modern world.`
  },
  {
    title: "Holidays in space",
    text: `Until recently, a trip into space was an [IMAGINE:unimaginable] dream for ordinary people. Today, several private companies are in fierce [COMPETE:competition] to offer flights to wealthy [TOUR:tourists]. Before the flight, passengers must complete a short but [DEMAND:demanding] training programme.

Once in orbit, they can enjoy several minutes of [WEIGHT:weightlessness] and a [BREATH:breathtaking] view of the Earth. However, a ticket costs an [BELIEVE:unbelievable] amount of money, and each launch has a [CONSIDER:considerable] impact on the environment. Critics ask whether this money could be spent more [WISE:wisely], for example on fighting poverty.

Supporters, by contrast, argue that space tourism will lead to important scientific [DISCOVER:discoveries] and that prices will eventually become [AFFORD:affordable] for the general public.`
  },
  {
    title: "Staying active",
    text: `Regular physical activity is [BENEFIT:beneficial] for both body and mind. Yet a [SURPRISE:surprising] number of adults lead a largely [ACT:inactive] lifestyle, spending most of the day sitting at a desk. Doctors warn that this can [WEAK:weaken] the muscles and increase the risk of heart disease.

The good news is that you do not need an [EXPENSE:expensive] gym membership to stay fit. Even a brisk thirty-minute walk can make a [NOTICE:noticeable] difference. The key is [CONSISTENT:consistency]: short, regular sessions are more [EFFECT:effective] than occasional [EXHAUST:exhausting] workouts.

Many people also find that exercising with friends increases their [MOTIVATE:motivation] and makes training far less [BORE:boring].`
  },
  {
    title: "Learning online",
    text: `The pandemic forced schools to move their lessons online almost [NIGHT:overnight]. For many teachers it was a [CHALLENGE:challenging] period, as they had to learn new digital tools with very little [PREPARE:preparation]. Students' experiences varied [ENORMOUS:enormously]: some enjoyed working at their own pace, while others found it hard to stay [FOCUS:focused].

Children from poorer families were often at a [ADVANTAGE:disadvantage], because they lacked a computer or a quiet place to study. In [ADD:addition], the lack of personal contact left many students feeling [ISOLATE:isolated].

Nevertheless, the experience proved that technology can be a [VALUE:valuable] tool. Many schools now use online platforms to [RICH:enrich] traditional lessons, and this [MIX:mixture] of methods seems to suit most learners.`
  },
  {
    title: "Green cities",
    text: `More than half of the world's [POPULATE:population] now lives in cities. As urban areas grow, so does the need for [SUSTAIN:sustainable] solutions. Many city councils are planting trees and creating parks to make the air [CLEAN:cleaner].

Rooftop gardens are now [WIDE:widely] seen as a smart idea. They not only produce fresh vegetables but also improve the [APPEAR:appearance] of grey concrete buildings. New cycle lanes have made it [SAFE:safer] for residents to leave their cars at home, and public transport has become more [RELY:reliable].

Of course, such projects require [SUBSTANCE:substantial] investment, and not all residents are [ENTHUSIASM:enthusiastic]. Some complain about the [CONVENIENT:inconvenience] caused by building works. Still, most experts believe that greener cities will be [HEALTH:healthier] places to live.`
  },
  {
    title: "Artificial intelligence in everyday life",
    text: `Artificial intelligence has developed at an [ASTONISH:astonishing] speed in recent years. Millions of people use AI tools on a [DAY:daily] basis, often without [REAL:realising/realizing] it. Translation apps, voice assistants and chatbots can save time and [SIMPLE:simplify] complicated tasks.

However, the technology also raises important [ETHIC:ethical] questions. AI systems sometimes produce [ACCURATE:inaccurate] information, and they may treat certain groups of people [FAIR:unfairly]. There are also fears that [AUTOMATE:automation] will replace human workers in many [INDUSTRY:industries].

Most specialists agree that clear [REGULATE:regulations/regulation/rules] are needed, and that people should learn to use these tools [CRITICAL:critically].`
  },
  {
    title: "Volunteering",
    text: `More and more young people are choosing to work as [VOLUNTARY:volunteers]. They help in animal shelters, hospitals and homes for the [ELDER:elderly], usually without any [PAY:payment]. Many say that the experience gave them a sense of [PROUD:pride] and helped them [STRONG:strengthen] their communication skills.

Volunteering also looks [IMPRESS:impressive] on a CV, as employers value candidates who have shown [INITIATE:initiative]. However, organisers warn that it should not be seen [PURE:purely] as a way to improve one's job prospects. Real [DEDICATE:dedication] is essential, because [DISAPPOINT:disappointment] can be painful for those who depend on regular visits.

Interestingly, studies show that helping others also makes volunteers [HAPPY:happier] themselves.`
  },
  {
    title: "Too many tourists?",
    text: `Tourism is one of the [FAST:fastest]-growing industries in the world. Every summer, popular cities such as Venice and Barcelona become [CROWD:overcrowded/crowded] with visitors. Local residents complain about noise, rubbish and rising rents, which have forced many families to [LOCATE:relocate] to the suburbs. Protests against mass tourism now take place [FREQUENT:frequently].

Some authorities have introduced daily [LIMIT:limits/limitations] on visitor numbers, while others have [COURAGE:discouraged] cruise ships from stopping in their ports. Supporters of tourism, however, point out that it brings [WEALTHY:wealth] to the region and creates thousands of jobs, so [COMPLETE:completely] closing the doors would be [REASON:unreasonable].

The solution, many believe, lies in persuading travellers to explore [FAMILIAR:unfamiliar] destinations outside the high season. Visitors should also be more [RESPECT:respectful] of local customs.`
  }
];

/* ===================================================================== */

const taskSelect = document.getElementById("taskSelect");
const textEl = document.getElementById("text");
const titleEl = document.getElementById("title");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");
const checkBtn = document.getElementById("checkBtn");
const showBtn = document.getElementById("showBtn");
const resetBtn = document.getElementById("resetBtn");
const nameInput = document.getElementById("studentName");

let gaps = [];   // {input, wrap, answers}
let checked = false;

try { nameInput.value = localStorage.getItem("wf_name") || ""; } catch (e) {}
nameInput.addEventListener("change", () => { try { localStorage.setItem("wf_name", nameInput.value.trim()); } catch (e) {} });

TASKS.forEach((t, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = `Task ${i + 1}: ${t.title}`;
  taskSelect.appendChild(o);
});
taskSelect.addEventListener("change", () => render(+taskSelect.value));

const norm = s => s.trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ");

function render(idx) {
  const task = TASKS[idx];
  titleEl.textContent = task.title;
  textEl.innerHTML = "";
  gaps = []; checked = false;
  resultEl.textContent = ""; statusEl.textContent = "";
  checkBtn.disabled = false;

  let n = 0;
  task.text.split(/\n\s*\n/).forEach(para => {
    const p = document.createElement("p");
    const re = /\[([A-Z\-]+):([^\]]+)\]/g;
    let last = 0, m;
    while ((m = re.exec(para)) !== null) {
      p.appendChild(document.createTextNode(para.slice(last, m.index)));
      const answers = m[2].split("/").map(norm);
      const wrap = document.createElement("span");
      wrap.className = "gap";
      const num = document.createElement("span");
      num.className = "num"; num.textContent = n;
      const input = document.createElement("input");
      input.type = "text"; input.autocomplete = "off"; input.spellcheck = false;
      input.setAttribute("autocapitalize", "off");
      const base = document.createElement("span");
      base.className = "base"; base.textContent = "(" + m[1] + ")";
      wrap.append(num, input, base);
      if (n === 0) {
        wrap.classList.add("example");
        input.value = m[2].split("/")[0];
        input.readOnly = true;
      } else {
        gaps.push({ input, wrap, answers, base: m[1] });
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            const i = gaps.findIndex(g => g.input === input);
            if (gaps[i + 1]) gaps[i + 1].input.focus(); else checkAnswers();
          }
        });
      }
      p.appendChild(wrap);
      last = re.lastIndex; n++;
    }
    p.appendChild(document.createTextNode(para.slice(last)));
    textEl.appendChild(p);
  });
}

function clearMarks() {
  gaps.forEach(g => {
    g.wrap.classList.remove("ok", "bad");
    const f = g.wrap.querySelector(".fix"); if (f) f.remove();
  });
}

function checkAnswers() {
  clearMarks();
  let score = 0;
  gaps.forEach(g => {
    const good = g.answers.includes(norm(g.input.value));
    g.wrap.classList.add(good ? "ok" : "bad");
    if (good) score++;
  });
  const total = gaps.length;
  const pct = Math.round(score / total * 100);
  resultEl.textContent = `Score: ${score} / ${total} (${pct}%)`;
  resultEl.style.color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "#b06000" : "var(--bad)";
  if (!checked) { checked = true; sendResult(score, total); }
}

function showAnswers() {
  if (!checked) checkAnswers();
  gaps.forEach(g => {
    if (g.wrap.classList.contains("bad") && !g.wrap.querySelector(".fix")) {
      const f = document.createElement("span");
      f.className = "fix"; f.textContent = "→ " + g.answers[0];
      g.wrap.appendChild(f);
    }
  });
}

function sendResult(score, total) {
  if (!SHEET_URL) return;
  const name = nameInput.value.trim();
  if (!name) { statusEl.textContent = "Tip: type your name before checking so your teacher gets your result."; return; }
  const data = new URLSearchParams({
    name,
    test: "Word formation – " + TASKS[+taskSelect.value].title,
    score, total,
    percent: Math.round(score / total * 100),
    wrong: gaps.filter(g => g.wrap.classList.contains("bad"))
               .map(g => `${g.base}: "${g.input.value.trim()}" (→ ${g.answers[0]})`).join("; "),
    date: new Date().toLocaleString("hu-HU")
  });
  fetch(SHEET_URL, { method: "POST", mode: "no-cors", body: data })
    .then(() => statusEl.textContent = "Result sent to your teacher ✓")
    .catch(() => statusEl.textContent = "Could not send the result (check your internet connection).");
}

checkBtn.addEventListener("click", checkAnswers);
showBtn.addEventListener("click", showAnswers);
resetBtn.addEventListener("click", () => render(+taskSelect.value));

render(0);
</script>
</body>
</html>
